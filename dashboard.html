<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospekt — Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <a class="skip-link" href="#pageTitle">Skip to content</a>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="2.4" width="11.5" height="2.4" rx="1.2" fill="#79818A"/>
          <rect x="3" y="6.2" width="15" height="2.4" rx="1.2" fill="#79818A"/>
          <rect x="3" y="10" width="8.5" height="2.4" rx="1.2" fill="#79818A"/>
          <rect x="3" y="13.8" width="13" height="2.4" rx="1.2" fill="#79818A"/>
          <g transform="rotate(-13 13.25 19.8)">
            <rect x="5.5" y="18" width="15.5" height="3.6" rx="1.8" fill="#D4A24C"/>
          </g>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Prospekt</div>
        <div class="brand-tag">Contact Intelligence</div>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Sections">
      <button type="button" class="nav-item active" data-page="overview" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="nav-label">Overview</span>
      </button>
      <button type="button" class="nav-item" data-page="contacts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">Contacts</span>
        <span class="nav-count" id="navContactCount">0</span>
      </button>
      <button type="button" class="nav-item" data-page="scans">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="nav-label">Scan History</span>
        <span class="nav-count" id="navScanCount">0</span>
      </button>
      <button type="button" class="nav-item" data-page="insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span class="nav-label">Insights</span>
      </button>
      <button type="button" class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2m-9-11h2m18 0h2m-3.3-6.7-1.4 1.4M6.7 17.3l-1.4 1.4m0-13.4 1.4 1.4m10.6 10.6 1.4 1.4"/></svg>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-stat">
        <span class="sidebar-stat-label">Auto-scan</span>
        <span class="sidebar-stat-value" id="autoScanStatus">—</span>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="topbar">
      <h1 class="page-title" id="pageTitle" tabindex="-1">Overview</h1>
      <div class="topbar-actions">
        <div class="search-global">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="globalSearch" placeholder="Search contacts, domains…" aria-label="Search contacts and domains">
        </div>
        <button type="button" class="btn btn-accent" id="exportContactsBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
      </div>
    </header>

    <div class="page active" id="page-overview" role="region" aria-label="Overview"></div>
    <div class="page" id="page-contacts" role="region" aria-label="Contacts"></div>
    <div class="page" id="page-scans" role="region" aria-label="Scan history"></div>
    <div class="page" id="page-insights" role="region" aria-label="Insights"></div>
    <div class="page" id="page-settings" role="region" aria-label="Settings"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="defaults.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
